[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
via_ir = true
optimizer = true
optimizer_runs = 700

[profile.ci]
via_ir = true
optimizer_runs = 700

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
sort_imports = true
