[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Fail the build on any warning: the protocol custodies user funds, so an
# unused variable or a shadowed declaration is a review finding, not a nit.
deny = "warnings"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

# Heavier settings for CI — same contracts, more search.
[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 64

[lint]
# Every window this protocol reasons about is at minimum an hour long, and most
# are measured in months or years (see VotiveLimits). A validator nudging
# `block.timestamp` by a few seconds cannot change any decision the contracts
# make, so the block-timestamp lint is noise here rather than signal — and
# leaving it on would mean suppressing it at a dozen call sites, which trains
# people to suppress it everywhere.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
sort_imports = true
