[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Fail the build on any warning: the protocol custodies user funds, so an
# unused variable or a shadowed declaration is a review finding, not a nit.
deny = "warnings"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

# Heavier settings for CI — same contracts, more search.
[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 64

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
sort_imports = true
